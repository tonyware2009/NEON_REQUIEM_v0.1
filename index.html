<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEON REQUIEM v0.1</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="overlay" class="show">
      <div class="panel">
        <div class="kicker">NIGHT CITY // SECTOR 07</div>
        <h1>NEON REQUIEM</h1>
        <p>Survive the corporate kill-zone.</p>
        <button id="startBtn">JACK IN</button>
        <div class="controls">
          <span><b>A/D</b> Move</span><span><b>W / SPACE</b> Jump</span>
          <span><b>MOUSE</b> Aim</span><span><b>LMB</b> Fire</span>
          <span><b>R</b> Reload</span><span><b>ESC</b> Pause</span>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
